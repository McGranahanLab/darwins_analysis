# WGD_pipeline, WES sandbox: the tx_data WES mock cohort. Same as config.wes.toml except the output dir and the manual
# QC table (the mock copy in tx_data/nemo_mock). LTX0009 and LTX0010 are mock tumours without an ALPACA input: they
# are left out and listed in failed_tumours.tsv. tx_data must be built with `pixi run build sandbox` (tx_data#14).
#   ./run.sh config.wes.sandbox.toml

[run]
cohort = "wes"                         # wgs or wes; check stops if a [tx_data.tables] entry belongs to the other
out_dir = "output/wes_sandbox"                 # everything is written here
tumours = []                           # only these tumour ids (e.g. ["LTX0001-Tumour1"]); empty = all
on_tumour_failure = "skip"             # skip: leave out tumours with missing/unusable inputs, list them with the
                                       # reason in <out_dir>/failed_tumours.tsv (Piotr, 2026-11-26); stop: fail

[tx_data]
dir = "../../tx_data/data"             # built tx_data store (data/*.parquet); on Nemo: a prod build

[tx_data.tables]                       # pipeline input -> tx_data table (WES tables; CONIPHER + segments: tx_data#14)
segments = "msai_segments"
clone_proportions = "clone_proportions"
conipher_mutations = "conipher_mutations"
conipher_tree_edges = "conipher_tree_edges"
conipher_cluster_info = "conipher_cluster_info"
alpaca = "alpaca"
alpaca_wgd_ratios = "alpaca_wgd_ratios"

[pgdd]
src = "~/scratch/ParallelGDDetect"           # checkout of amf71/ParallelGDDetect (tested at cb0437b)
rscript = "Rscript"                    # e.g. "micromamba run -n pgdd Rscript"

[pgdd.settings]                        # passed verbatim to detect_par_gd(); WES thresholds (Piotr, 2026-11-09)
discover_mut_cpn_2_threshold = 1.5
check_mut_cpn_2_threshold = 1.25       # pass explicitly: PGDD's NULL default falls back to 1.5
discover_num_muts_threshold = 10
discover_frac_2_cpn_muts_threshold = 0.25
check_frac_2_cpn_muts_threshold = 0.1
discover_num_2_cpn_muts_threshold = 5
check_num_2_cpn_muts_threshold = 3
bootstrap_discovery = true
n_boot = 500
seed = 1
stability_threshold = 0.7
stability_alpha = 0.05
stability_use_binom_test = true
stability_adjust_method = "BH"
track = false

[wgd]
quality_cutoff = 0.3                   # WGD caller: GDs with event quality below this are rejected (step 05
                                       # --reject-below); the correction uses the filtered calls. -1 = keep all
reject_mutation_supported = false      # also reject low-quality mutation-supported GDs
keep_nontree_clusters = false          # step 00: keep mutations on clusters off the default CONIPHER tree
alpaca_score = "max_AB"                # step 04 ALPACA tie-break score: max_AB (2026-11-09) or ratio_A
review_quality = 0.3                   # step 07: list tumours scoring below this

[qc]
enabled = true                         # upstream QC (manual QC table) + CCF QC (truncal meanCCF > 90, from
                                       # tx_data wgs_conipher_cluster_info); failing tumours stay in the output
# The manual QC table is read from its file, not from tx_data.
manual_qc_table = "../../tx_data/nemo_mock/project/proj-tracerx-lung/tracerx/_RELEASE/release_tx842/_aggregate/20250729_tx842_manual_qc_complete_post_refphase.tsv"

[correction]
min_quality = -1                       # correct only tumours whose call quality is >= this; -1 = all

# ---- step 04 parameters (the WGD caller's rules; same keys as WGD/params.toml) ----
[wgd.params]

# ---- ploidy fill ----
majority = 0.5               # a clone's subtree carries a sample when > this fraction of it
min_coverage = 0.1           # relaxed fill pass: smallest share of a sample a clone must cover
fill_minor_clones = true     # minor-clone pass: also double clones left below their sample's level, if no cell
                             # ends above its sample's level (LTX0552-T2)
minor_min_cells = 0.0        # minor-clone pass: a GD must bring more than this share of cells (summed) to target

# ---- quality ----
ploidy_margin = 0.10         # borderline_ploidy full credit at this distance from 0.5; also "clear" for the prior
min_support = 10             # low_mut_support full credit
alpaca_threshold = 1.5       # alpaca_disagrees full credit at this max(ratio_A, ratio_B)
alpaca_mut_floor = 0.9       # alpaca_disagrees lowest value for a mutation-supported GD with >= min_support doubled
                             # mutations (0.5 without mutations, linear in between); LTX1348
majority_coverage = 0.5      # minority_coverage: 0.2 at 0, 0.5 at this coverage
minor_clone_factor = [0.6, 0.9]  # minor_clone (GD from the minor-clone pass): [sliver of cells, >= majority_coverage]
reversion_min_share = 0.5    # a clone with k GDs on its path reverts when > this share of its cells is in samples
                             # PGDD calls with < k GDs (LTX0272); fails the tumour
ambiguity_majorities = [0.4, 0.6]  # ambiguous_solution: other majority cut-offs tried

# ---- majority ploidy prior (Rule updated on 2026-11-12, caused by LTX0981-Tumour1) ----
# If more than prior_min_clear_fraction of samples are clearly (margin >= ploidy_margin) at the
# same GD level, borderline samples one level off are moved to it: raised (clonal-GD prior) or
# lowered (diploid prior).
prior_enabled = true
prior_mode = "search"        # search: try moving borderline samples (fewer than prior_max_moved_fraction of them)
                             # up or down, keep the simplest fill, tie-break: fewest PGDD events split, smallest move
                             # (example LTX1020); "majority": the one-way majority move (prior_min_clear_fraction, ...)
prior_max_moved_fraction = 0.5
prior_max_combinations = 2000 # above this many combinations, fall back to the majority rule
# prior_band = 0.10          # borderline = within this of 0.5; unset = ploidy_margin
prior_min_clear_fraction = 0.5
prior_borderline_majority = true  # also when every sample is borderline at a level and most (> prior_min_clear_fraction)
                                  # are on one side (example LTX0693)
prior_require_simpler = true # use the prior only if the fill gets simpler (fewer missing, forced, then added GDs)
prior_raised_factor = [0.6, 0.85]   # quality factor: [edge of band, next to 0.5]
prior_lowered_factor = [0.75, 0.95] # diploid prior is stronger, so a smaller penalty

[wgd.params.fixed]                      # fixed quality factors
ambiguous_solution = 0.5
reversion = 0.2
ploidy_path_mismatch = 0.5
unplaced_events = 0.5
multicluster_parent_child = 0.7
fill_tie = 0.8
fill_count_differs = 0.9
reversion_to_diploid = 0.0   # also reversion_to_lower_ploidy; the tumour's status becomes `failed`
